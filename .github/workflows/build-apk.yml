name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Environment Verification ==="
          java -version
          echo "JAVA_HOME is: $JAVA_HOME"
          
          if [ -z "$JAVA_HOME" ] || [ ! -d "$JAVA_HOME" ]; then
            echo "::error::JAVA_HOME is not set or not a valid directory."
            exit 1
          fi

          # Extract Java major version
          RAW_JAVA_VERSION=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}')
          echo "Detected raw Java version string: $RAW_JAVA_VERSION"
          
          if [ -z "$RAW_JAVA_VERSION" ]; then
            echo "::error::Failed to detect Java version from 'java -version' output."
            exit 1
          fi

          # Get major version number (e.g., '17.0.1' -> 17, '1.8.0_302' -> 8)
          JAVA_MAJOR_VERSION=$(echo "$RAW_JAVA_VERSION" | awk -F '.' '{if ($1 == "1") print $2; else print $1}')
          echo "Detected Java major version: $JAVA_MAJOR_VERSION"

          if [ -z "$JAVA_MAJOR_VERSION" ] || ! [[ "$JAVA_MAJOR_VERSION" =~ ^[0-9]+$ ]]; then
            echo "::error::Could not parse a valid integer major version from '$RAW_JAVA_VERSION'."
            exit 1
          fi

          if [ "$JAVA_MAJOR_VERSION" -lt 17 ]; then
            echo "::error::Active Java version ($JAVA_MAJOR_VERSION) is lower than 17. Java 17 or newer is required."
            exit 1
          fi

          echo "Java environment verified successfully: Java $JAVA_MAJOR_VERSION (>= 17)."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          echo "=== Checking / Generating Temporary Debug Keystore ==="
          if [ -f "./debug.keystore" ]; then
            echo "Existing debug.keystore found in repository root."
          else
            echo "debug.keystore not found. Generating temporary debug keystore using Java keytool..."
            keytool -genkeypair \
              -v \
              -keystore ./debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          if [ ! -f "./debug.keystore" ]; then
            echo "::error::Failed to create ./debug.keystore."
            exit 1
          fi

          echo "Temporary debug keystore verified."

      - name: Build Debug APK
        run: |
          echo "=== Building Debug APK ==="
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify Debug APK output
        id: verify_apk
        run: |
          echo "=== Verifying Debug APK Output ==="
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "::error::Expected debug APK not found at $EXPECTED_APK"
            echo "Searching exclusively in app/build/outputs/apk for discovered APKs:"
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -type f -name "*.apk"
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

          if [ ! -s "$EXPECTED_APK" ]; then
            echo "::error::Discovered APK at $EXPECTED_APK is empty (0 bytes)."
            exit 1
          fi

          if [[ "$EXPECTED_APK" != *.apk ]]; then
            echo "::error::$EXPECTED_APK does not have a .apk extension."
            exit 1
          fi

          APK_SIZE=$(stat -c%s "$EXPECTED_APK" 2>/dev/null || stat -f%z "$EXPECTED_APK")
          echo "APK verified successfully:"
          echo "  Path: $EXPECTED_APK"
          echo "  Size: $APK_SIZE bytes"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          echo "=== Preparing APK Release Asset ==="
          SOURCE_APK="app/build/outputs/apk/debug/app-debug.apk"
          
          # Create a temporary staging directory in runner temp space
          RELEASE_ASSET_DIR="${{ runner.temp }}/release_assets"
          mkdir -p "$RELEASE_ASSET_DIR"

          # Sanitize repository name (e.g., 'owner/my-app' -> 'my-app')
          REPO_RAW="${{ github.repository }}"
          REPO_NAME=$(basename "$REPO_RAW" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-zA-Z0-9._-]/-/g')
          RUN_NUMBER="${{ github.run_number }}"
          
          RELEASE_FILENAME="${REPO_NAME}-debug-build-${RUN_NUMBER}.apk"
          DEST_PATH="${RELEASE_ASSET_DIR}/${RELEASE_FILENAME}"

          cp "$SOURCE_APK" "$DEST_PATH"

          if [ ! -f "$DEST_PATH" ] || [ ! -s "$DEST_PATH" ]; then
            echo "::error::Failed to stage release asset at $DEST_PATH"
            exit 1
          fi

          echo "Staged release asset:"
          echo "  Filename: $RELEASE_FILENAME"
          echo "  Path: $DEST_PATH"

          echo "asset_path=$DEST_PATH" >> "$GITHUB_OUTPUT"
          echo "asset_name=$RELEASE_FILENAME" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== Checking GitHub CLI ==="
          gh --version

          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"

          if [ -z "$ASSET_PATH" ] || [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "::error::Release asset validation failed. Asset path: '$ASSET_PATH'"
            exit 1
          fi

          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"
          COMMIT_SHA="${{ github.sha }}"

          echo "Creating GitHub Release with tag: $RELEASE_TAG"

          RELEASE_NOTES="### Automatically Generated Debug APK 📱
          
- **Builder**: GitHub Actions
- **Run Number**: #${{ github.run_number }}
- **Run Attempt**: #${{ github.run_attempt }}
- **Source Commit**: \`${COMMIT_SHA}\`
- **Asset**: \`${ASSET_NAME}\`

> ⚠️ **Testing Notice**: This is an automatically generated debug build signed with a temporary debug certificate for development and testing purposes. It is not intended for Google Play Store production release."

          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --target "$COMMIT_SHA" \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== Workflow Result Summary ==="
          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"
          RELEASE_STATUS="${{ steps.publish_release.outcome }}"

          echo "### 📦 Build & Release Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "- **APK Build**: ✅ Succeeded (\`app-debug.apk\` generated)" >> "$GITHUB_STEP_SUMMARY"
          echo "- **GitHub Actions Artifact**: ✅ Uploaded as \`app-debug-apk\` (available under the workflow Summary tab)" >> "$GITHUB_STEP_SUMMARY"

          if [ "$RELEASE_STATUS" = "success" ]; then
            echo "Release published successfully."
            RELEASE_URL=""
            if command -v gh &> /dev/null; then
              gh release view "$RELEASE_TAG" || true
              RELEASE_URL=$(gh release view "$RELEASE_TAG" --json url -q .url 2>/dev/null || echo "https://github.com/${{ github.repository }}/releases/tag/${RELEASE_TAG}")
            else
              RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/${RELEASE_TAG}"
            fi

            echo "Release Tag: $RELEASE_TAG"
            echo "Release URL: $RELEASE_URL"
            echo "APK Asset Name: $ASSET_NAME"

            echo "- **GitHub Release Status**: ✅ Published" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Release Tag**: \`$RELEASE_TAG\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Direct Download URL**: [View Release & Download APK]($RELEASE_URL)" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "📱 **Download Instructions**: On your Android device or browser, visit the [Release Page]($RELEASE_URL) and download \`$ASSET_NAME\` directly from the Assets list." >> "$GITHUB_STEP_SUMMARY"
            echo "💡 The GitHub Actions workflow artifact \`app-debug-apk\` also remains available under the summary tab as a backup." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release creation did not complete successfully or was skipped."
            echo "The APK build succeeded and the artifact 'app-debug-apk' was uploaded successfully."
            
            echo "- **GitHub Release Status**: ⚠️ Failed or skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "⚠️ **Note on Release Creation**: Release publishing encountered an issue or required permissions, but the **Debug APK build succeeded**." >> "$GITHUB_STEP_SUMMARY"
            echo "📥 You can download the verified debug APK directly from the **Artifacts** section on this workflow run page (\`app-debug-apk\`)." >> "$GITHUB_STEP_SUMMARY"
          fi
